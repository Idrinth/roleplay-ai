server {
  listen 80;
  listen [::]:80;

  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types
      text/plain
      text/css
      text/javascript
      text/xml
      application/javascript
      application/json
      application/xml
      application/xml+rss
      application/xhtml+xml
      image/svg+xml;

  location / {
    index index.html;
    gzip_static on;
    try_files $uri /index.html;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location ~* \.(avif|webp|jpg|jpeg|png|svg|mp3)$ {
    expires 1y;
    gzip_static on;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept";
  }

  location ~* \.(min\.js|css)$ {
    expires 1m;
    gzip_static on;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept";
  }

  location /chat {
    index index.html;
    gzip_static on;
    try_files $uri /chat.html;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /addons {
    index index.html;
    gzip_static on;
    try_files $uri /addons.html;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /legal {
    index index.html;
    gzip_static on;
    try_files $uri /legal.html;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /imprint {
    index index.html;
    gzip_static on;
    try_files $uri /imprint.html;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /login {
    index index.html;
    gzip_static on;
    try_files $uri /login.html;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }
}
