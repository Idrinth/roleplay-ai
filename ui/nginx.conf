server {
  listen 80;
  listen [::]:80;

  root /usr/share/nginx/html;

  location / {
    index index.html;
    try_files $uri /index.html;
  }

  location /chat {
    index index.html;
    try_files $uri /chat.html;
  }

  location /imprint {
    index index.html;
    try_files $uri /imprint.html;
  }
}
