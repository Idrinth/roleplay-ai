server {
  listen 80;
  listen [::]:80;

  root /usr/share/nginx/html;

  location / {
    index index.html;
    try_files $uri /index.html;
  }

  location /audio {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location /chat {
    index index.html;
    try_files $uri /chat.html;
  }

  location /imprint {
    index index.html;
    try_files $uri /imprint.html;
  }
}
