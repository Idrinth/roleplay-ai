<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Wolfgang AI - Your personal GameMaster</title>
        <link rel="stylesheet" href="/styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="canonical" href="https://###DESIRED_ROOT###/chat/new"/>
        <meta name="description" content="Chat with the Wolfgang AI to role play single player theatre of mind games"/>
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Wolfgang AI" />
        <link rel="manifest" href="/site.webmanifest" />
    </head>
    <body class="chat">
        <nav class="skiplinks">
            <ul>
                <li><a href="#mainnav">Skip to main navigation</a></li>
                <li><a href="#content">Skip to content</a></li>
            </ul>
        </nav>
        <nav id="mainnav">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/imprint">Imprint & Privacy</a></li>
                <li><a href="/chat/new">Start New Session</a></li>
                <li><a href="/login">Login</a></li>
                <li><a rel="noopener noreferrer" aria-label="link opens in new tab" href="https://discord.gg/idrinth" target="_blank">Discord</a></li>
                <li><a rel="noopener noreferrer" aria-label="link opens in new tab" href="https://github.com/bjoern-buettner/roleplay-ai" target="_blank">GitHub</a></li>
            </ul>
        </nav>
        <h1>
            <span id="logo" role="button" aria-label="changes the color mode on click" tabindex="0" title="click to switch color mode" class="gamemaster"></span>
            <span>Wolfgang AI</span> for <span id="playername"></span>
        </h1>
        <div class="content" id="content">
            <ul id="chat"></ul>
            <ul class="aside" id="worlds">
                <li>
                    <a href="/chat/new" class="button call-to-action">START NEW CHAT</a>
                </li>
                <li>
                    <a id="donate-button" aria-label="opens in a new window" rel="noopener noreferrer"
                       title="Donate to keep the project up and running using PayPal." class="button"
                       href="https://www.paypal.com/donate/?hosted_button_id=AENZ9E63F85G8" target="_blank">Donate</a>
                </li>
            </ul>
            <ul class="aside" id="characters">
                <li><button id="add-character" title="Add new character sheet" type="button">+ Character</button></li>
            </ul>
            <ul class="aside" id="documents">
                <li>
                    <label for="world">World keywords</label>
                    <input type="text" title="keyword, other keyword,..." id="world" value=" "/>
                    <label for="music-select">Volume of "<span id="songname">Nothing</span>"(<span id="songcategory">Uncategorized</span>)</label>
                    <select
                      id="music-select"
                      aria-label="Change background music volume"
                      aria-controls="music"
                      title="Change background music volume"
                    >
                        <option selected="selected" value="0">Muted</option>
                        <option value="0.01">Very Low</option>
                        <option value="0.1">Low</option>
                        <option value="0.25">Medium Low</option>
                        <option value="0.5">Medium</option>
                        <option value="0.75">Medium High</option>
                        <option value="1">High</option>
                    </select>
                    <audio id="music" aria-hidden="true"></audio>
                </li>
                <li><button id="add-document" title="Add new document" type="button">+ Document</button></li>
            </ul>
            <div id="footer">
                <textarea id="chat-entry" placeholder="Please enter your action(s) and your surrounding to have the bot create a story with you!"></textarea>
                <p>
                    Remaining: <span id="messages-left">0</span>/<span id="messages-maximum">0</span>
                </p>
                <button id="send" type="button" class="call-to-action">Send</button>
            </div>
        </div>
        <footer>&copy;2025 Björn 'Idrinth' Büttner. The chatbot may make mistakes, please do not abuse it.</footer>
        <ul id="swipe-dots"></ul>
        <ul id="share"></ul>
        <div id="loader" style="display:none"><img src="/loader.gif" alt="Loading"/></div>
        <script type="text/javascript"  src="/shared-##.min.js"></script>
        <script type="text/javascript"  src="/chat-##.min.js"></script>
    </body>
</html>
