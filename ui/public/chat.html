<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Gamemaster AI</title>
        <link rel="stylesheet" href="/styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body class="chat">
        <nav>
            <ul>
                <li><a href="/home">Home</a></li>
                <li><a href="/chat">Chats</a></li>
                <li><a href="/imprint">Imprint & Privacy</a></li>
                <li><a rel="noopener noreferrer" href="https://discord.gg/idrinth" target="_blank">Discord</a></li>
                <li><a rel="noopener noreferrer" href="https://github.com/bjoern-buettner/roleplay-ai" target="_blank">GitHub</a></li>
            </ul>
        </nav>
        <h1>
            <span id="logo" title="click to switch color mode" class="gamemaster"></span>
            <span>Wolfgang 'Storyteller' AI</span> for <span id="playername"></span>
        </h1>
        <div class="content">
            <ul id="chat"></ul>
            <ul id="worlds">
                <li>
                    <a href="/chat/new" class="button">START NEW CHAT</a>
                </li>
                <li>
                    <div id="donate-button-container">
                        <div id="donate-button"></div>
                    </div>
                </li>
            </ul>
            <ul id="characters">
                <li><button id="add-character" title="Add new character sheet" type="button">+ Character</button></li>
            </ul>
            <ul id="documents">
                <li>
                    <label for="world">World keywords</label>
                    <input type="text" title="keyword, other keyword,..." id="world"/>
                </li>
                <li><button id="add-document" title="Add new document" type="button">+ Document</button></li>
            </ul>
            <div id="footer">
                <textarea id="chat-entry" placeholder="Please enter your action(s) and your surrounding to have the bot create a story with you!"></textarea>
                <button id="send" type="button" disabled>Send</button>
            </div>
        </div>
        <footer>&copy;2025 Björn 'Idrinth' Büttner. The chatbot may make mistakes, please do not abuse it.</footer>
        <div id="loader" style="display:none"><img src="loader.gif" alt="Loading"/></div>
        <script type="text/javascript" src="/showdown.min.js"></script>
        <script type="text/javascript" src="/js-yaml.min.js"></script>
        <script type="text/javascript"  src="/scripts.js"></script>
        <script type="text/javascript"  src="/dark-light-switch.js"></script>
        <script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js" charset="UTF-8"></script>
        <script type="text/javascript"  src="/paypal.js"></script>
    </body>
</html>
