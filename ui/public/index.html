<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gamemaster AI</title>    
    <link rel="stylesheet" href="./css/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="./images/logo.light.svg" type="image/x-icon">
</head>

<body>
    <header class="menu-container">
        <img class="navigation-position desktop-hidden" id="navigation-position-1">
        <img class="logo" src="./images/logo.dark.svg" id="logo">
        <img class="navigation-position desktop-hidden" id="navigation-position-2">
        <h1 class="mobile-hidden title" id="app-title">Gamemaster A.I</h1>
    </header>
    <main>
        <aside id="side-menu-container" class="side-menu-container">
            <img src="./images/book-marker.png" alt="Pull Side Menu Button" class="book-marker" id="book-marker">
            <button id="new-chat-buton" class="new-chat-button">New Chat +</button>
            <span class="chat-title">Chats</span>
            <nav class="chat-history-outer-container">
                <ul class="chat-history-list">
                </ul>
            </nav>
            <div class="config-container">
                <button id="config" class="setting-icon config"></button>
                <button id="theme-changer" class="setting-icon theme-changer"></button>
            </div>
        </aside>
        <div class="chat-outer-container">
            <div class="chat-inner-container">
                <ul id="chat" class="chat">
                </ul>
                <div class="chat-entry-container">
                    <textarea name="" id="chat-entry" class="chat-entry"></textarea>
                    <button class="send-button">Send</button>
                </div>
            </div>
        </div>
        <div class="file-receivers-outer-container">
            <section class="files-outer-container">
                <h1 class="files-title">Characters <span class="plus-btn">+</span></h1>
                <ul class="files-dropdown-list" id="characters-list">
                </ul>
            </section>
            <section class="files-outer-container">
                <h1 class="files-title" id="world-title">World Building <span class="plus-btn">+</span></h1>
                <div class="world-files-inner-container">
                    <ul class="files-dropdown-list">
                    </ul>
                    <div class="keywords-container">
                        <h4>Keywords:</h4>
                        <textarea class="keywords-entry" name="" id="world"></textarea>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script type="text/javascript" src="./showdown.min.js"></script>
    <script type="text/javascript" src="./js-yaml.min.js"></script>
    <script type="text/javascript" src="./scripts.js"></script>
</body>

</html>
