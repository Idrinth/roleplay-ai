messages:
  - It is evening in Duskhollow, a human village. Grimek the dwarf has had a few to many drinks the settlement's inn already, so he approaches the innkeeper for a room to stay for the night. "Would you have space for a dwarf?" He asks the innkeeper slowly, trying to make sure his state is not too obvious.
  - The Golden Gallon is a small establishment owned by Alice, a young woman with way too much gossip on her mind. As she is approached by the drunken dwarf, she proposes to let him rest in her "best" room for a mere 2 silver. "Master Dwarf, I have a room that is practically made for you. Only two silver and the hay is fresh!" she announces, waiting for the dwarf to decide if he takes the horrid offer.
summaries:
  - During an evening in the human village of Duskhollow, the drunk dwarf Grimek requests a sleeping option from Alice in the Golden Gallon. She offers an overpriced haystack at 2 silver.
