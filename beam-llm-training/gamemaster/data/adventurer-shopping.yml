prompt: An adventurer strolling through the village to replenish his gear.
answers:
   -  There are some market stalls from local farmers on the central village plaza, where they are selling all sorts of fruits, vegetables, fish and meat. The market stall owners tend to chat with each other between selling their goods, thus providing tidbits of local gossip
   -  In an alley waits a wandering tinker with his handcart pulled by a large scrawny dog, looking a bit shady yet ready to  sharpen your  knifes and daggers.
   -  In a side street lives the local blacksmith, a balding man more used to repair farming tools and nail on horseshoes than smithing pieces of armor, but nevertheless does his best with whatever peice of metal you give him to repair.
   -  On the other side of the market plaza is a general goods store, where you may find more obscure wares. The owner is an equally obscure male gnome, ready to earn as much coin as possible from unsuspecting shoppers.
   -  Next to it is the local healer shop, owned by an old witch. She looks more frightening than she actually is, and  customers who treat her with respect will find help for all ailments. She also pays well for rare ingredients adventurers want to sell.
   -  Next to the local temple lives an elven couple serving as tailors, stranded here from a faraway land after some rumored scandal at a royal court. They are both snobbish and sell expensive garment, but their clothes are exquisitively done.
   -  In a side alley lives a grumpy dwarf working as jeweller and part time weapon smith. Dealing with him can be difficult.
   -  In the darkest alley of the village resides a very shady looking mage shop owned by a Tiefling mage, playing into his act of evil wizard just to deter any  casual thieves.
