messages:
  - It is evening in Duskhollow, a human village. Grimek the dwarf has had a few to many drinks the settlement's inn already, so he approaches the innkeeper for a room to stay for the night. "Would you have space for a dwarf?" He asks the innkeeper slowly, trying to make sure his state is not too obvious.
  - Duskhollow's Dancing Ogre is owned by Maurice, a broad man in his fifties. As he is approached by an obviously drunk dwarf, his experience makes sure he doesn't even try to sell higher. "Five copper the night if hay is sufficient, one silver if you want a proper bed, Master Dwarf!" he suggests, hoping for Grimek to pay for the bed.
descriptions:
  - An evening tavern scene a village named Duskhollow. The Dancing Ogre inn is mostly lit by lanterns and a hearth. At the counter stands Maurice, a broad-shouldered human innkeeper in his fifties with a weathered face, wearing a simple apron. In front of him, Grimek the dwarf, slightly swaying from too much ale, is trying to look composed. His cheeks are flushed, beard tangled, and he squints with concentration as he carefully asks for a room. The tavern atmosphere is cozy, with wooden beams, dirty mugs of ale on nearby tables, and the faint shadow of local patrons in the background.
