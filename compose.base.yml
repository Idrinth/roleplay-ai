name: roleplay-ai
volumes:
  mariadb_data: {}
  qdrant_storage: {}
  mongodata_db: {}
  mongodata_config: {}
  redis: {}
services:
  loki:
    build:
      dockerfile: loki/Dockerfile
      no_cache: true
    healthcheck:
      test: [ "CMD", "echo", "0" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:3100:3100"
    restart: always
    depends_on:
      promtail:
        condition: service_healthy
  redis:
    image: redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: loki
      options:
        loki-url: http://127.0.0.1:3100/loki/api/v1/push
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: "3"
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - redis:/data
  qdrant:
    image: qdrant/qdrant
    restart: always
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "echo", "0"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - qdrant_storage:/qdrant/storage
    logging:
      driver: loki
      options:
        loki-url: http://127.0.0.1:3100/loki/api/v1/push
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: "3"
    depends_on:
      loki:
        condition: service_healthy
  mariadb:
    image: mariadb
    deploy:
      replicas: 1
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: example
    healthcheck:
      test: ["CMD", "echo", "0"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mariadb_data:/var/lib/mysql
    logging:
      driver: loki
      options:
        loki-url: http://127.0.0.1:3100/loki/api/v1/push
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: "3"
    depends_on:
      loki:
        condition: service_healthy
  mongo:
    image: mongo
    deploy:
      replicas: 1
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    healthcheck:
      test: ["CMD", "echo", "0"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongodata_db:/data/db
      - mongodata_config:/data/configdb
    logging:
      driver: loki
      options:
        loki-url: http://127.0.0.1:3100/loki/api/v1/push
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: "3"
    depends_on:
      loki:
        condition: service_healthy
  ui:
    deploy:
      replicas: 1
    build:
      dockerfile: ui/Dockerfile
      no_cache: true
      args:
        DESIRED_ROOT: wolfgang-ai.com
    restart: always
    logging:
      driver: loki
      options:
        loki-url: http://127.0.0.1:3100/loki/api/v1/push
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: "3"
    depends_on:
      loki:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://0.0.0.0"]
      interval: 10s
      timeout: 5s
      retries: 5
  reverse-proxy:
    deploy:
      replicas: 1
    build:
      dockerfile: reverse_proxy/Dockerfile
      no_cache: true
    logging:
      driver: loki
      options:
        loki-url: http://127.0.0.1:3100/loki/api/v1/push
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: "3"
    ports:
      - '127.0.0.1:8016:80'
    depends_on:
      ui:
        condition: service_healthy
      app:
        condition: service_healthy
