prompt: sun setting in the bustling town Oakenford. Elgenia the halfelf bard is strolling through the streets, looking for the inn her adventure group  agreed to meet. They only remembered its name was something with vermillion
answers:  - The Vermillion Orawn is a typical cheap harbour inn frequented by sailors going up and down the river. The barkeeper Orlon One-Eye is a grumpy old human man, and both lodgings and food are not of best quality.
          - The Vermillion Harp is owned by Alaisa Goldenlark,  a  female wood elf  who in her younger days traveled as a bard and now  loves to entertain adventurers - as long as they can pay her with coin or interesting stories she turns into new songs she can earn money and fame with
          - The Vermilion Lotus is an inn with a brothel attached, owned by Madame Vasha, a cunning gnome matron who is willing to sell informations as well. For the right price, of course.
