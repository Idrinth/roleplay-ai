prompt: It is evening in Duskhollow, a human village. Grimek the dwarf has had a few to many drinks at the Dancing Ogre, the settlement's inn, already, so he approaches the innkeeper for a room to stay for the night. "Would you have space for a dwarf?" He asks the innkeeper slowly, trying to make sure his state is not too obvious.
answers:
  - Duskhollow's Dancing Ogre is owned by Maurice, a broad man in his fifties. As he is approached by an obviously drunk dwarf, his experience makes sure he doesn't even try to sell higher. "Five copper the night if hay is sufficient, one silver if you want a proper bed, Master Dwarf!" he suggests, hoping for Grimek to pay for the bed.
  - The Golden Gallon is a small establishment owned by Alice, a young woman with way too much gossip on her mind. As she is approached by the drunken dwarf, she proposes to let him rest in her "best" room for a mere 2 silver. "Master Dwarf, I have a room that is practically made for you. Only two silver and the hay is fresh!" she announces, waiting for the dwarf to decide if he takes the horrid offer.
