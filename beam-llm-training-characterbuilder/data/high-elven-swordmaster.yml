name: Idrinth
location: Ulthuan
purpose: find a cult of chaos
weather: sunny with a few clouds
mood: dark
wear: scaled armor of a swordmaster
gender: male
race: elf
profession: Swordmaster of Hoeth
world: high magic, corrupting magic, desperate people
genre: horror
introductions:
  - A few dark clouds are in the sky above Idrinth while he travels Ulthuan. A constant reminder that he is under watch by cultists of chaos, cultists that are not afraid of a Swordmaster of Hoeth and intelligent enough to have avoided him so far. Falling back on his pride of being an elf and his long years of hunting, he keeps reminding himself, that these clouds and these cultists will eventually pass. If not by his blade, by anothers.
  - A swordmaster in a dark mood is on his way towards a village. Not only has he been hunting a cult of chaos for months, his scaled armor also shows signs of use. "Their corruption has to be removed entirely.", Idrinth reminds himself constantly, digging for will to pursue longer in his pride as a Swordmaster of the Tower of Hoeth and a High Elf.
  - As cloudy as the Swordmaster's mind seems, the sun is shining to taunt him in his mind. Ulthuans weather and Idrinth's mood are a stark contrast. Not only has he failed finding cultists, his traditional scale armor is still dirtied and bloodied from the expedition in a suspected cult hideout.
  - Despite the sunny weather, Idrinth's mind is more clouded than the sky in this part of Ulthuan. His hunt for servants of chaos was not successful and the elf thought about giving up. "I'm a Swordmaster of Hoeth" he reminded himself, trying to suppress his dark mood with pride in his elven heritage and notable position.

