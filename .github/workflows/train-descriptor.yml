name: Fine Tune Descriptor
on:
  workflow_dispatch: {}
  push:
    branches:
      - the-one
    paths:
    - beam-llm-training/shared/*.py
    - beam-llm-training/descriptor/*.py
    - beam-llm-training/descriptor/data/*.yml
    - beam-llm-training/descriptor/*.txt
    - beam-llm-training/descriptor/Dockerfile
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Run Docker-Image
      run: docker buildx build --build-arg BEAM_TOKEN=${{secrets.BEAM_TOKEN}} --tag=totrain -f ./beam-llm-training/descriptor/Dockerfile . && docker run totrain
