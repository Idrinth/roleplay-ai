name: Character Builder Deployment
on:
  workflow_dispatch: {}
  push:
    branches:
      - the-one
    paths:
    - beam-llm-hosting/shared/*.py
    - beam-llm-hosting/characterbuilder/*.py
    - beam-llm-hosting/characterbuilder/*.txt
    - beam-llm-hosting/characterbuilder/Dockerfile
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Run Docker-Image
      run: docker buildx build --build-arg BEAM_TOKEN=${{secrets.BEAM_TOKEN}} --tag=todeploy -f ./beam-llm-hosting/characterbuilder/Dockerfile . && docker run todeploy
